<style>
/* Layout: one narrow column; dark shirt-pattern header, team picker, day tabs, roster + match list */
:root{
  --bg:#EEF1F7;--surface:#FFFFFF;--surface-2:#E4E9F3;--fg:#0E1630;--muted:#56607A;--line:#D3DAE8;
  --blue:#1F4FD1;--cyan:#1478B8;--coral:#D9412A;--on-accent:#FFFFFF;
  --head:#0A1022;--head-fg:#F2F5FF;--head-muted:#9AA6C6;--head-line:#24315A;
  --f-display:"Exo 2","Segoe UI",system-ui,sans-serif;--f-body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1022;--surface:#121B36;--surface-2:#1A2650;--fg:#EEF2FF;--muted:#9AA6C6;--line:#26345F;
  --blue:#4A7BFF;--cyan:#45BDF7;--coral:#FF5A43;--on-accent:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1022;--surface:#121B36;--surface-2:#1A2650;--fg:#EEF2FF;--muted:#9AA6C6;--line:#26345F;
  --blue:#4A7BFF;--cyan:#45BDF7;--coral:#FF5A43;--on-accent:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-fg);overflow:hidden;border-bottom:3px solid var(--coral)}
header .pattern{position:absolute;inset:0;pointer-events:none}
header .wrap{position:relative;display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:44px;height:44px;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;gap:6px;align-items:center;flex:none}
.langs{display:flex;border:1px solid var(--head-line);border-radius:8px;overflow:hidden}
.langs button{background:transparent;color:var(--head-muted);border:0;font:600 12px/1 var(--f-body);letter-spacing:.06em;padding:9px 8px;cursor:pointer;min-width:34px}
.langs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--head-line);background:transparent;color:var(--head-fg);display:grid;place-items:center;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px}
label.lbl{font:600 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:7px}
.selwrap{position:relative}
select{appearance:none;-webkit-appearance:none;width:100%;font:600 17px/1.2 var(--f-body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 44px 14px 14px;cursor:pointer}
.selwrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px/1.2 var(--f-body);padding:10px 6px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(10,16,34,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.team{padding:16px;display:flex;flex-direction:column;gap:12px}
.team h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1 var(--f-body);padding:6px 9px;border-radius:6px;background:var(--surface-2);color:var(--fg)}
.chip.league{background:var(--blue);color:#fff}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.roster li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.sx{font:600 11px/1 var(--f-body);color:var(--muted);width:14px;flex:none;letter-spacing:.04em}
.games{display:flex;flex-direction:column;gap:10px}
.game{overflow:hidden}
.game .row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;background:transparent;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.time{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:66px;color:var(--cyan)}
.opp{flex:1;min-width:0}
.opp small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.opp b{display:block;font-weight:600;font-size:16.5px;line-height:1.25}
.stage{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);transition:transform .2s;flex:none}
.game[data-open="true"] .chev{transform:rotate(180deg)}
.game .detail{padding:0 14px 12px 94px}
.badge{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:5px;margin-top:5px}
.badge.now{background:var(--coral);color:#fff}
.badge.next{border:1.5px solid var(--coral);color:var(--coral)}
.game.is-now,.game.is-next{border-color:var(--coral)}
.game.is-now .time,.game.is-next .time{color:var(--coral)}
.game.past .time{color:var(--muted)}
.tblock{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:66px;flex:none}
.court{font:600 11.5px/1 var(--f-body);letter-spacing:.04em;color:var(--fg);background:var(--surface-2);padding:4px 6px;border-radius:5px;white-space:nowrap}
.optnote{font-size:13.5px;color:var(--muted);margin:0}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:13px 14px;align-items:start}
.optn{font:700 26px/1 var(--f-display);color:var(--cyan);text-align:center;padding-top:2px}
.opt b{display:block;font-weight:600;font-size:15.5px}
.opt .br{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:14.5px}
.optrow .t{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.optlater{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.pill{font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:6px 9px;border-radius:7px;flex:none}
.pill.win{background:var(--blue);color:#fff}
.pill.loss{background:var(--surface-2);color:var(--fg)}
.pill.live{border:1.5px solid var(--coral);color:var(--coral)}
.gms{display:flex;flex-direction:column;margin-bottom:10px}
.gm{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.gm:first-child{border-top:0}
.ev{font:600 12px/1 var(--f-body);letter-spacing:.05em;color:var(--muted)}
.pp{font-size:14.5px;line-height:1.3}.pp span{display:block}.pp small{display:block;color:var(--muted);font-size:13px}
.sets{font:600 14px/1.25 var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gm.win .sets,.gm.win .ev{color:var(--blue)}.gm.loss .sets{color:var(--muted)}
.sub{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 2px}
.note{font-size:13px;color:var(--muted);margin-bottom:8px}
.tslink{display:inline-block;margin-top:10px;font-size:13.5px;color:var(--cyan)}
.livebar{font-size:12.5px;color:var(--muted);margin-top:-8px}.livebar.err{color:var(--coral)}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sect span{font-size:13px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px;padding-top:6px}
footer a{color:var(--cyan)}
@media (max-width:380px){.brand span{display:none}.game .detail{padding-left:14px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>

/* Language: the viewer's own choice, otherwise the phone's language (et/ru/en), otherwise English. */

/* A newer version of the page was deployed: reload once, keeping what the viewer had open. */
function reloadForUpdate(v){
  try{if(sessionStorage.getItem("ulsans-reloaded")===v)return;sessionStorage.setItem("ulsans-reloaded",v);
    sessionStorage.setItem(RESTORE_KEY,JSON.stringify({open:[...S.open],day:S.day,y:window.scrollY||0}))}catch(e){return}

}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flip=n=>{const i=n.indexOf(", ");return i<0?n:n.slice(i+2)+" "+n.slice(0,i)};
const groupLabel=(t,L)=>L.group.charAt(0).toUpperCase()+L.group.slice(1)+" "+t.g;
const OUR_IDS=new Set(OURS.map(t=>t.id));

function nowTallinn(){
  const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Tallinn",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  return p.replace(" ","T");
}
if(restoreY===null&&nowTallinn().slice(0,10)>=DAY2)S.day=2;
function addMin(dt,m){const d=new Date(dt+":00Z");d.setUTCMinutes(d.getUTCMinutes()+m);return d.toISOString().slice(0,16)}
const tallinnTime=iso=>new Intl.DateTimeFormat("et-EE",{timeZone:"Europe/Tallinn",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const names=a=>a&&a.length?a.map(n=>esc(flip(n))).join(" / "):"—";
/* the site gives scores as [home, away]; turn them into [Ulsans, opponent] */
const mine=(p,home)=>home?[p[0],p[1]]:[p[1],p[0]];

/* All Ulsans matches: Saturday from the data above, corrected by the live site (time changes),
   plus any match the site adds later (Sunday), once we know which two teams play in it. */
function allMatches(){
  const out=[],seen=new Set();
  for(const m of MATCHES){
    const r=S.res[m[4]];seen.add(String(m[4]));
    out.push({mid:String(m[4]),team:m[0],opp:m[3],home:!!m[5],date:(r&&r.date)||m[1],time:(r&&r.time)||m[2],court:S.courtByMid[m[4]]||m[6]||null,oppName:NAMES[m[3]],stage:null});
  }
  for(const [mid,r] of Object.entries(S.res)){
    if(seen.has(mid))continue;
    const mt=S.meta[mid];if(!mt)continue;
    let team,opp,home;
    if(OUR_IDS.has(mt.homeId)){team=mt.homeId;opp=mt.awayId;home=true}
    else if(OUR_IDS.has(mt.awayId)){team=mt.awayId;opp=mt.homeId;home=false}
    else continue;
    const parts=(r.draw||"").split(/\s+–\s+/).filter((x,i,a)=>a.indexOf(x)===i);
    out.push({mid,team,opp,home,date:r.date,time:r.time,court:S.courtByMid[mid]||null,oppName:NAMES[opp]||(home?r.away:r.home)||"?",stage:parts.slice(1).join(" · ")||null});
  }
  return out;
}
function rosterOf(id){
  if(R[id])return R[id];
  const t=S.teams[id];return t?[t.men,[...t.women,...(t.other||[])]]:null;
}
function rosterHTML(id,L){
  const r=rosterOf(id);if(!r)return S.live?`<p class="note">${L.loading}</p>`:"";
  return '<ul class="roster">'+r[0].map(n=>`<li><span class="sx">${L.m}</span><span>${esc(flip(n))}</span></li>`).join("")+r[1].map(n=>`<li><span class="sx">${L.w}</span><span>${esc(flip(n))}</span></li>`).join("")+"</ul>";
}
function scorePill(m){
  const r=S.res[m.mid],d=S.det[m.mid];
  const sc=(r&&r.score)||(d&&d.score);if(!sc)return "";
  const [a,b]=mine(sc,m.home);const st=a+b>=5?(a>b?"win":"loss"):"live";
  return `<span class="pill ${st}">${a}:${b}</span>`;
}
function gamesHTML(m,L){
  if(!S.live)return "";
  const d=S.det[m.mid];
  if(!d)return `<p class="note">${L.loading}</p>`;
  const played=(d.games||[]).filter(g=>g.sets.length||g.note);
  if(!played.length)return `<p class="note">${L.noRes}</p>`;
  return '<div class="gms">'+d.games.map(g=>{
    const ours=m.home?g.h:g.a,theirs=m.home?g.a:g.h;
    const win=g.w&&((m.home&&g.w===1)||(!m.home&&g.w===2));
    const cls=g.w?(win?"win":"loss"):"";
    const sets=g.sets.map(x=>mine(x,m.home).join("-")).join(" ")||esc(g.note||"");
    return `<div class="gm ${cls}"><span class="ev">${L.ev[g.ev]||esc(g.ev)}</span><span class="pp"><span>${names(ours)}</span><small>${names(theirs)}</small></span><span class="sets">${sets}</span></div>`;
  }).join("")+"</div>";
}

const getJSON=async u=>{const r=await fetch(u,{cache:"no-store"});return r.json()};
async function loadResults(){
  try{
    const j=await getJSON("/api/results");
    S.live=true;
    if(j.ok){S.err=false;S.res=j.matches||{};S.fetched=j.fetched;
      if(j.version){if(S.version&&j.version!==S.version)return reloadForUpdate(j.version);S.version=j.version}}
    else S.err=true;
  }catch(e){if(S.live)S.err=true;else S.live=false}
  /* matches the page does not know yet: ask which teams play (cached on the server for hours) */
  const known=new Set(MATCHES.map(m=>String(m[4])));
  const missing=Object.keys(S.res).filter(mid=>!known.has(mid)&&!S.meta[mid]);
  await Promise.all(missing.map(async mid=>{try{const j=await getJSON("/api/match?meta=1&id="+mid);if(j.ok)S.meta[mid]=j}catch(e){}}));
  render();
}
async function loadDraws(){
  if(!S.live)return;
  try{
    const j=await getJSON("/api/draws");
    if(j.ok){S.draws=j.draws;const c={};j.draws.forEach(d=>d.rows.forEach(r=>{if(r.mid&&r.court)c[r.mid]=r.court}));S.courtByMid=c}
  }catch(e){}
  render();
}
let drawsTick=0;
async function loadDetail(mid){
  if(!S.live)return;
  try{const j=await getJSON("/api/match?id="+mid);if(j.ok)S.det[mid]=j}catch(e){}
  render();
}
async function loadTeam(id){
  if(!S.live||R[id]||S.teams[id])return;
  try{const j=await getJSON("/api/team?id="+id);if(j.ok)S.teams[id]=j}catch(e){}
  render();
}
function refresh(){
  if(document.visibilityState==="hidden")return;
  loadResults().then(()=>S.open.forEach(mid=>{const d=S.det[mid];if(!d||!d.done)loadDetail(mid)}));
  if(++drawsTick%5===0)loadDraws();
}

function buildSelect(L){
  const sel=$("team");sel.innerHTML="";
  ["E","2","3","R"].forEach(lg=>{
    const og=document.createElement("optgroup");og.label=L.lg[lg];
    OURS.filter(t=>t.lg===lg).forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=`${t.name} · ${L.lg[lg]} · ${groupLabel(t,L)}`;og.appendChild(o)});
    sel.appendChild(og);
  });
  sel.value=S.team;
}
/* Sunday before the brackets are filled: for each possible place in our group,
   the first playoff match (time, court, opponent slot) and when that bracket continues. */
function bracketName(name,L){
  const p=name.match(/Position\s*0*(\d+)\s*-\s*0*(\d+)/);if(p)return L.pos(+p[1],+p[2]);
  const k=name.match(/(\d+)\.\s*koht/);if(k)return L.koht(+k[1]);
  return name.split(/\s+–\s+/).slice(1).join(" · ");
}
function slotText(x,L){
  if(!x)return L.prev;
  const m=x.match(/^Group (\w+) #(\d+)$/);return m?L.ph(m[1],+m[2]):esc(x);
}
function sundayOptions(t,L){
  const league=LEAGUE_ON_SITE[t.lg];
  const brackets=(S.draws||[]).filter(d=>d.name.split(/\s+–\s+/)[0]===league&&!/Group \w+\s*$/.test(d.name));
  let html=`<p class="optnote">${L.optNote}</p>`;
  for(let n=1;n<=t.size;n++){
    const ph=`Group ${t.g} #${n}`;let best=null;
    brackets.forEach(d=>d.rows.forEach(r=>{
      if(r.date===DAY2&&r.time&&(r.home===ph||r.away===ph)&&(!best||r.time<best.r.time))best={d,r};
    }));
    let body;
    if(best){
      const other=best.r.home===ph?best.r.away:best.r.home;
      const later=[...new Set(best.d.rows.filter(x=>x.date===DAY2&&x.time&&x.time>best.r.time).map(x=>x.time))].sort();
      body=`<span class="br">${esc(bracketName(best.d.name,L))}</span>
        <div class="optrow"><span class="t">${best.r.time}</span>${best.r.court?`<span class="court">${L.court} ${esc(best.r.court)}</span>`:""}<span>${L.vs.toLowerCase()}: ${slotText(other,L)}</span></div>
        ${later.length?`<span class="optlater">${L.later} ${later.join(", ")}</span>`:""}`;
    }else body=`<span class="br">${L.none}</span>`;
    html+=`<div class="card opt"><span class="optn">${n}</span><div><b>${L.place(n)}</b>${body}</div></div>`;
  }
  return html;
}
const CHEV='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function render(){
  const L=T[S.lang];document.documentElement.lang=S.lang;
  ["et","ru","en"].forEach(l=>$("l-"+l).setAttribute("aria-pressed",l===S.lang));
  $("t-team").textContent=L.team;$("d1").textContent=L.d1;$("d2").textContent=L.d2;
  $("d1").setAttribute("aria-selected",S.day===1);$("d2").setAttribute("aria-selected",S.day===2);
  $("t-sched").textContent=L.sched;$("t-src").textContent=L.src;$("t-site").textContent=L.site;
  buildSelect(L);
  const t=OURS.find(x=>x.id===S.team);const r=R[t.id];
  $("teamcard").innerHTML=`<h2>${esc(t.name)}</h2><div class="meta"><span class="chip league">${L.lg[t.lg]}</span><span class="chip">${groupLabel(t,L)}</span><span class="chip">${r[0].length+r[1].length} ${L.players}</span></div>${rosterHTML(t.id,L)}`;
  const lb=$("livebar");lb.hidden=!S.live;
  if(S.live){lb.className="livebar"+(S.err?" err":"");lb.textContent=S.err?L.err:L.live+(S.fetched?" · "+L.upd+" "+tallinnTime(S.fetched):"")}
  const day=S.day===1?DAY1:DAY2;
  const list=allMatches().filter(m=>m.team===t.id&&m.date===day).sort((a,b)=>a.time.localeCompare(b.time));
  const games=$("games");
  if(!list.length){
    $("t-hint").textContent="";
    games.innerHTML=S.day!==2?"":(S.draws?sundayOptions(t,L):`<div class="card empty"><b>${L.e2t}</b>${L.e2}</div>`);
    return;
  }
  $("t-hint").textContent=L.hint;
  const now=nowTallinn();let nextFound=false;
  games.innerHTML=list.map(m=>{
    const start=m.date+"T"+m.time,end=addMin(start,60);
    let cls="",badge="";
    if(now>=start&&now<end){cls="is-now";badge=`<span class="badge now">${L.now}</span>`}
    else if(now>=end&&now.slice(0,10)===m.date){cls="past"}
    else if(now<start&&now.slice(0,10)===m.date&&!nextFound){nextFound=true;cls="is-next";badge=`<span class="badge next">${L.next}</span>`}
    const open=S.open.has(m.mid);
    const stage=m.stage?`<small class="stage">${esc(m.stage)}</small>`:"";
    return `<div class="card game ${cls}" data-open="${open}"><button type="button" class="row" data-k="${m.mid}" data-opp="${m.opp}" aria-expanded="${open}"><span class="tblock"><span class="time">${m.time}</span>${m.court?`<span class="court">${L.court} ${esc(m.court)}</span>`:""}</span><span class="opp"><small>${L.vs}</small><b>${esc(m.oppName)}</b>${stage}${badge}</span>${scorePill(m)}${CHEV}</button>${open?`<div class="detail">${gamesHTML(m,L)}${S.live?`<div class="sub">${L.lineup}</div>`:""}${rosterHTML(m.opp,L)}<a class="tslink" href="${TS+m.mid}" target="_blank" rel="noopener">${L.ts} ↗</a></div>`:""}</div>`;
  }).join("");
}

const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

function paintThemeBtn(){const d=isDark();const b=$("theme");b.innerHTML=d?SUN:MOON;b.setAttribute("aria-label",d?T[S.lang].light:T[S.lang].dark)}
const savedTheme=store.get("theme");if(savedTheme==="dark"||savedTheme==="light")document.documentElement.setAttribute("data-theme",savedTheme);

$("theme").addEventListener("click",()=>{const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);store.set("theme",n);paintThemeBtn()});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{S.lang=b.dataset.l;store.set("lang",S.lang);render();paintThemeBtn()}));
$("team").addEventListener("change",e=>{S.team=+e.target.value;S.open.clear();store.set("team",S.team);render()});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{S.day=+b.dataset.d;render()}));
$("games").addEventListener("click",e=>{
  const b=e.target.closest("button.row");if(!b)return;const k=b.dataset.k;
  if(S.open.has(k))S.open.delete(k);
  else{S.open.add(k);if(S.live&&!(S.det[k]&&S.det[k].done))loadDetail(k);loadTeam(+b.dataset.opp)}
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn);
setInterval(()=>{render();refresh()},60000);
document.addEventListener("visibilitychange",refresh);

render();paintThemeBtn();loadResults().then(loadDraws);
if(restoreY)requestAnimationFrame(()=>window.scrollTo(0,restoreY));
